services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devpath
      POSTGRES_PASSWORD: devpath
      POSTGRES_DB: devpath
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devpath -d devpath']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - '8080:3000'
    env_file:
      - path: ./server/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: '3000'
      CLIENT_URL: http://localhost:8080
      CLIENT_DIST: /app/client/dist
      DATABASE_URL: postgresql://devpath:devpath@postgres:5432/devpath?schema=public
      AUTH_COOKIE_SECURE: 'false'
      AUTH_COOKIE_SAMESITE: lax
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

volumes:
  postgres_data:
  uploads_data:

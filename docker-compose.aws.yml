services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: devpath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: devpath
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devpath -d devpath']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${ECR_IMAGE}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
      CLIENT_URL: ${CLIENT_URL}
      CLIENT_DIST: /app/client/dist
      DATABASE_URL: postgresql://devpath:${POSTGRES_PASSWORD}@postgres:5432/devpath?schema=public
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAMESITE: lax
      UPLOAD_DIR: /data/uploads
      JWT_SECRET: ${JWT_SECRET}
      SITE_ACCESS_PASSWORD: ${SITE_ACCESS_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    volumes:
      - /data/uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./infra/aws/Caddyfile:/etc/caddy/Caddyfile:ro
      - /data/caddy:/data
      - /data/caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

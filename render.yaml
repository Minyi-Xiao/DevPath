databases:
  - name: devpath-db
    plan: basic-256mb

services:
  - type: web
    name: devpath
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    disk:
      name: devpath-uploads
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_COOKIE_SECURE
        value: 'true'
      - key: AUTH_COOKIE_SAMESITE
        value: lax
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: CLIENT_DIST
        value: /app/client/dist
      - key: DATABASE_URL
        fromDatabase:
          name: devpath-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
